# MongoDB embarqué pour les tests
quarkus.mongodb.connection-string=mongodb://localhost:27017/test
quarkus.mongodb.database=test
quarkus.mongodb.devservices.enabled=false

# REST / JAX-RS
quarkus.http.test-port=8081

# Logs MongoDB
quarkus.mongodb.log.level=DEBUG

# Hibernate / Panache
quarkus.hibernate-orm.database.generation=drop-and-create

# Jackson
quarkus.jackson.fail-on-unknown-properties=false

# Logs spécifiques au projet
quarkus.log.category."org.shopouille".level=DEBUG
